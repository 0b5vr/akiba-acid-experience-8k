name: Build

on: push

defaults:
  run:
    shell: bash

env:
  SHADER_MINIFIER_VERSION: 1.6.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: init stuff
        uses: ./.github/actions/init

      - name: build shader-minifier
        uses: ./.github/actions/build-shader-minifier
        with:
          version: ${{ env.SHADER_MINIFIER_VERSION }}
          output: shader-minifier-dist

      - name: install shader-minifier binary
        run: |
          cp shader-minifier-dist/ShaderMinifier bin/shader_minifier
          chmod +x bin/shader_minifier
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: build
        run: pnpm build

      - name: report build size
        run: |
          {
            echo "- \`compressed.html\`: $(node -e "console.log(($(stat -c%s dist/compressed.html)).toLocaleString('en-US'))") bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: prepare pages
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages
          cp dist/compressed.html pages/index.html

      - name: upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
